services:
  # docker compose -f docker-compose-prod.yml up -d --build
  ################################
  # FRONTEND NEXTJS
  ################################
  nextjs:
    container_name: nextjs
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile.prod

    image: nextjs-frontend:latest

    restart: unless-stopped

    #env_file:
    #- .env

    environment:
      NODE_ENV: ${NODE_ENV}
      API_URL: ${API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

    expose:
      - "3000"

    networks:
      - app-network

    #healthcheck:
    #test:
    #["CMD-SHELL", "wget --spider --quiet http://localhost:3000 || exit 1"]
    #interval: 30s
    #timeout: 5s
    #retries: 3
    #start_period: 30s

  ################################
  # STRAPI BACKEND
  ################################
  strapi:
    container_name: strapi

    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod

    image: strapi:latest

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      NODE_ENV: ${NODE_ENV}
      API_URL: ${API_URL}
      PUBLIC_URL: ${PUBLIC_URL}

    expose:
      - "1337"

    depends_on:
      strapiDB:
        condition: service_healthy

    volumes:
      - strapi-uploads:/opt/app/public/uploads

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider --quiet http://localhost:1337/_health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ################################
  # POSTGRES
  ################################
  strapiDB:
    container_name: strapiDB

    image: postgres:16.14-bookworm

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    volumes:
      - strapi-data-prod:/var/lib/postgresql/data

    networks:
      - app-network

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ################################
  # NGINX REVERSE PROXY
  ################################
  nginx:
    image: nginx:1.31.0

    container_name: nginx

    restart: unless-stopped

    depends_on:
      #nextjs:
      #condition: service_healthy

      strapi:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      - ./letsencrypt:/etc/letsencrypt

      - ./nginx/certbot/www:/var/www/certbot

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ################################
  # CERTBOT SSL
  ################################
  certbot:
    image: certbot/certbot:v5.7.0

    container_name: certbot

    volumes:
      - ./letsencrypt:/etc/letsencrypt

      - ./nginx/certbot/www:/var/www/certbot

    networks:
      - app-network

################################
# STORAGE
################################

volumes:
  strapi-data-prod:
  strapi-uploads:

################################
# NETWORK
################################

networks:
  app-network:
    name: app-network

    driver: bridge
