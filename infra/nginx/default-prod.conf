#################################################
# HTTPS FRONTEND NEXTJS
#################################################

server {

    listen 443 ssl http2;

    server_name asadacalleconcha.com www.asadacalleconcha.com;


    #################################################
    # SSL CERTIFICATE
    #################################################

    ssl_certificate /etc/letsencrypt/live/asadacalleconcha.com/fullchain.pem;

    ssl_certificate_key /etc/letsencrypt/live/asadacalleconcha.com/privkey.pem;


    #################################################
    # Security
    #################################################

    ssl_protocols TLSv1.2 TLSv1.3;


    #################################################
    # Next.js
    #################################################

    location / {


        proxy_pass http://nextjs:3000;


        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;


        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;


        # Next.js streaming / RSC
        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";


        proxy_cache_bypass $http_upgrade;

    }

}



#################################################
# HTTPS STRAPI CMS
#################################################

server {


    listen 443 ssl http2;


    server_name cms.asadacalleconcha.com;



    #################################################
    # SSL CERTIFICATE
    #################################################

    ssl_certificate /etc/letsencrypt/live/cms.asadacalleconcha.com/fullchain.pem;

    ssl_certificate_key /etc/letsencrypt/live/cms.asadacalleconcha.com/privkey.pem;



    ssl_protocols TLSv1.2 TLSv1.3;



    #################################################
    # Uploads grandes
    #################################################

    client_max_body_size 100M;



    #################################################
    # Strapi
    #################################################

    location / {


        proxy_pass http://strapi:1337;


        proxy_http_version 1.1;



        #################################################
        # Headers importantes para Strapi
        #################################################

        proxy_set_header Host $host;


        proxy_set_header X-Real-IP $remote_addr;


        proxy_set_header X-Forwarded-Host $host;


        proxy_set_header X-Forwarded-Server $host;


        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_set_header X-Forwarded-Proto https;



        #################################################
        # Websocket / Admin
        #################################################

        proxy_set_header Upgrade $http_upgrade;


        proxy_set_header Connection "upgrade";


        proxy_pass_request_headers on;



        #################################################
        # Timeouts
        #################################################

        proxy_connect_timeout 60s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;

    }



    #################################################
    # Healthcheck Nginx interno
    #################################################

    location /nginx-health {

        access_log off;

        return 200 "healthy\n";

        add_header Content-Type text/plain;

    }

}